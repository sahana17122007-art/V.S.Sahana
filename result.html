<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f6fb;margin:0}
header{background:#17365D;color:#fff;padding:16px 40px;font-weight:bold}
main{max-width:700px;margin:30px auto;background:#fff;padding:24px;border-radius:12px}
h2{text-align:center;color:#17365D;border-bottom:2px solid #17365D;padding-bottom:8px}
button{background:#17365D;color:#fff;border:0;padding:10px 22px;border-radius:6px}
</style></head><body>
<header>LegalEase &ndash; Generated Draft</header>
<main><h2>{{ title }}</h2>
{% for heading, text in clauses %}
<p><b>Clause {{ loop.index }}: {{ heading }}</b><br>{{ text }}</p>
{% endfor %}
<form method="post" action="/download" style="display:inline">
{% for k, v in data.items() %}<input type="hidden" name="{{k}}" value="{{v}}">{% endfor %}
<button type="submit">Download PDF</button></form>
<a href="/" style="margin-left:16px">Create another</a>
</main></body></html>
